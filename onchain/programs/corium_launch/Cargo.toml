[package]
name = "corium_launch"
version = "0.1.0"
description = "Corium Launch - supernova bounty distributor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "corium_launch"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
solana-sha256-hasher = "3.1"
solana-security-txt = "1.1.3"
